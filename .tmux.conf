# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Reduce scroll speed: scroll 3 lines per wheel tick (default is 5)
bind -T copy-mode WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# When not in copy mode, enter copy mode and scroll on wheel up
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" \
    "if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -X -N 3 scroll-up'"

bind -n WheelDownPane if-shell -F "#{mouse_any_flag}" "send-keys -M" \
    "if -F '#{pane_in_mode}' 'send-keys -X -N 3 scroll-down' 'send-keys -M'"
